name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python & test vote
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r vote/requirements.txt pytest
          python -m py_compile vote/app.py

      - name: Set up Node & test result
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          cd result
          npm ci
          node --check server.js

      - name: Set up .NET & test worker
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build worker/Worker.csproj

  build-scan-push:
    name: Build, Trivy Scan & Push (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, result, worker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image tagged with commit SHA
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/voting-${{ matrix.service }}:${{ env.IMAGE_TAG }} ./${{ matrix.service }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/voting-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: Push image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/voting-${{ matrix.service }}:${{ env.IMAGE_TAG }}
